name: ci

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Generate and validate sample payload
        run: |
          python main.py run
          python main.py validate
          python main.py doctor

      - name: Streamlit health smoke test
        run: |
          PORT=8508 python -m streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8508 --server.headless true &
          sleep 8
          curl -f http://127.0.0.1:8508/_stcore/health

