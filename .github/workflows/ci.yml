name: ci

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      JOBFORGE_USE_OPENAI: "false"
      OPENAI_MODEL: "gpt-5-mini"
      JOBFORGE_DEMO_DATE: "2026-08-01"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest

      - name: Generate and validate sample payload
        run: |
          python main.py run
          python main.py validate
          python main.py doctor

      - name: Streamlit health smoke test
        run: |
          PORT=8508 sh -c 'python -m streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port ${PORT:-8501} --server.headless true' &
          sleep 8
          curl -f http://127.0.0.1:8508/_stcore/health
