[project]
name = "jobforge"
version = "0.1.0"
description = "Multi-agent employability assistant for discovering, ranking, and preparing grounded job applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99,<2",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "streamlit[auth]>=1.60,<2",
    "mcp>=1,<2",
    # MCP authentication dependency; 46.x retains a wheel for the supported macOS development runtime.
    "cryptography>=42,<47",
    "toml>=0.10.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
jobforge = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
