[project]
name = "jobforge"
version = "0.1.0"
description = "Multi-agent employability assistant for discovering, ranking, and preparing grounded job applications."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.99,<2",
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
jobforge = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
