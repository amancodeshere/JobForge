[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port ${PORT:-8501} --server.headless true"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
